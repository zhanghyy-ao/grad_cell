[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradcell"
version = "0.1.0"
description = "Goal-conditioned amortized optimization for differentiable battery-cell design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
physics = ["pybamm>=25.0", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

