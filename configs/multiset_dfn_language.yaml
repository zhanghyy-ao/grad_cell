experiment:
  name: multiset_dfn_language
  seed: 7

physics:
  model: DFN
  parameter_sets:
    - Chen2020
    - ORegan2022
    - Prada2013
    - Ecker2015
    - Marquis2019
  samples_per_mode: 1024
  candidate_factor: 4
  batch_size: 8
  c_rates: [1.0, 5.0, 6.0]
  calibration_rate: 0.1
  calibration_iterations: 2
  maximum_duration_factor: 1.5
  time_points: 301
  rtol: 1.0e-8
  atol: 1.0e-10
  output: data/multiset_dfn_language/physics_archive_modes_v3.jsonl
  audit: data/multiset_dfn_language/physics_audit_modes_v3.jsonl
  manifest: data/multiset_dfn_language/physics_manifest_modes_v3.json

perturbation:
  sampler: sobol
  regular_fields:
    Positive electrode porosity: [0.80, 1.20]
    Negative electrode porosity: [0.80, 1.20]
    Separator porosity: [0.85, 1.15]
    Positive electrode active material volume fraction: [0.90, 1.10]
    Negative electrode active material volume fraction: [0.90, 1.10]
    Positive particle diffusivity multiplier: [0.30, 3.00]
    Negative particle diffusivity multiplier: [0.30, 3.00]
  extreme_fields:
    Positive electrode porosity: [0.65, 1.35]
    Negative electrode porosity: [0.65, 1.35]
    Separator porosity: [0.70, 1.30]
    Positive electrode active material volume fraction: [0.80, 1.20]
    Negative electrode active material volume fraction: [0.80, 1.20]
    Positive particle diffusivity multiplier: [0.10, 10.00]
    Negative particle diffusivity multiplier: [0.10, 10.00]

review:
  min_capacity_change_fraction: 0.01
  min_energy_change_fraction: 0.01
  min_average_voltage_change_v: 0.005

dataset:
  variants_per_design: 3
  output: data/multiset_dfn_language/battery_description_modes_v3.jsonl
  manifest: data/multiset_dfn_language/battery_description_manifest_modes_v3.json

split:
  train: 0.80
  validation: 0.10
  test: 0.10

# A description contains finite-precision DFN summaries, so multiple separated
# structures within these performance tolerances are valid inverse labels.
inverse_ambiguity:
  relative_tolerances:
    reference_capacity_ah: 0.005
    energy_1c_wh: 0.005
    capacity_1c_ah: 0.005
    discharge_time_1c_s: 0.01
    energy_5c_wh: 0.005
    capacity_5c_ah: 0.005
    discharge_time_5c_s: 0.01
    energy_6c_wh: 0.005
    capacity_6c_ah: 0.005
    discharge_time_6c_s: 0.01
  absolute_tolerances:
    average_voltage_1c_v: 0.01
    minimum_voltage_1c_v: 0.01
    average_voltage_5c_v: 0.01
    energy_retention_5c: 0.005
    average_voltage_6c_v: 0.01
    energy_retention_6c: 0.005
  minimum_log_rms: 0.10
  minimum_maximum_fraction: 0.20
  changed_parameter_fraction: 0.10
  minimum_changed_parameters: 2
  maximum_alternatives_per_design: 5
  audit: data/multiset_dfn_language/inverse_ambiguity_audit_modes_v3.jsonl
  report: data/multiset_dfn_language/inverse_ambiguity_report_modes_v3.json

language:
  provider: deepseek
  api_key_env: DEEPSEEK_API_KEY
  base_url_env: DEEPSEEK_BASE_URL
  model_env: DEEPSEEK_MODEL
  concurrency_env: DEEPSEEK_CONCURRENCY
  default_base_url: https://api.deepseek.com
  default_model: deepseek-chat
  default_concurrency: 8
  temperature: 0.9
  max_tokens: 500
  retries: 3
  timeout_s: 90
