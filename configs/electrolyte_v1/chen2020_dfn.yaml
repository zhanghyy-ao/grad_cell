experiment: electrolyte_v1_fixed_material_dfn
seed: 7

data:
  source: CALiSol-23
  doi: 10.11583/DTU.24559960
  conductivity_unit: mS/cm
  group_split: source_doi
  physics_samples: 32

model:
  target: standardized_log_ionic_conductivity_ms_cm
  hidden_dim: 128
  depth: 3
  output_constraint: unbounded

physics:
  model: DFN
  parameter_set: Chen2020
  input_parameter: Log electrolyte conductivity scale
  reference_conductivity_ms_cm: 10.0
  current_a: 5.0
  current_ramp_time_s: 0.0
  probe_horizon_s: 600.0
  time_points: 41
  physical_voltage_cutoffs: true
  rtol: 1.0e-6
  atol: 1.0e-8

training:
  epochs: 100
  property_batch_size: 256
  physics_batch_size: 2
  learning_rate: 3.0e-4
  property_loss: huber_standardized_log_conductivity
  voltage_loss: huber
  voltage_scale_v: 0.05
  physics_weight: 1.0
  patience: 20
  gradient_clip_norm: 5.0
